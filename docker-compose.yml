services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - isimnet_data:/data
    env_file: .env
    environment:
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  isimnet_data:
